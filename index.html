<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫번째 아이디어</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #eff6ff, #dbeafe 45%, #bfdbfe 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      padding: 3.5rem 5rem;
      border-radius: 24px;
      border: 1px solid rgba(191, 219, 254, 0.8);
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.12),
        0 0 0 1px rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 60px rgba(30, 64, 175, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      font-weight: 800;
      color: #1d4ed8;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 4px 12px rgba(37, 99, 235, 0.15));
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>내 첫번째 아이디어</h1>
  </div>
</body>

</html>
