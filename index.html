<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘도 힘내세요</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at top left, #eff6ff, #dbeafe 45%, #bfdbfe 100%);
      --text-gradient: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #38bdf8 100%);
      --text-shadow: rgba(37, 99, 235, 0.18);
      --card-border: rgba(191, 219, 254, 0.85);
      --card-shadow: rgba(30, 64, 175, 0.14);
      --btn-bg: #2563eb;
      --btn-hover: #1d4ed8;
      --btn-glow: rgba(37, 99, 235, 0.45);
      --btn-ring: rgba(147, 197, 253, 0.6);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: background 0.6s ease;
    }

    .container {
      background: rgba(255, 255, 255, 0.88);
      padding: 3.5rem 5rem;
      border-radius: 28px;
      border: 1px solid var(--card-border);
      box-shadow: 0 24px 60px var(--card-shadow),
        0 0 0 1px rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.6s ease, border-color 0.6s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 320px;
      max-width: 90vw;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 70px var(--card-shadow),
        0 0 0 1px rgba(255, 255, 255, 0.9);
    }

    h1 {
      font-size: clamp(2.3rem, 5vw, 3.8rem);
      font-weight: 800;
      background: var(--text-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 4px 14px var(--text-shadow));
      min-height: 1.35em;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    h1.fade {
      opacity: 0;
      transform: translateY(-6px);
    }

    .next-btn {
      margin-top: 2.2rem;
      padding: 0.95rem 2.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--btn-bg);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 6px 22px var(--btn-glow),
        0 0 0 1px rgba(255, 255, 255, 0.3) inset;
      transition: background 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
      letter-spacing: -0.01em;
      user-select: none;
    }

    .next-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--btn-glow),
        0 0 0 3px var(--btn-ring);
    }

    .next-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px var(--btn-glow);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="phrase">오늘도 힘내세요</h1>
    <button class="next-btn" id="nextBtn">다음 문장 보기</button>
  </div>

  <script>
    const themes = [
      {
        text: "오늘도 힘내세요",
        bgGradient: "radial-gradient(circle at top left, #eff6ff, #dbeafe 45%, #bfdbfe 100%)",
        textGradient: "linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #38bdf8 100%)",
        textShadow: "rgba(37, 99, 235, 0.18)",
        cardBorder: "rgba(191, 219, 254, 0.85)",
        cardShadow: "rgba(30, 64, 175, 0.15)",
        btnBg: "#2563eb",
        btnHover: "#1d4ed8",
        btnGlow: "rgba(37, 99, 235, 0.45)",
        btnRing: "rgba(147, 197, 253, 0.6)"
      },
      {
        text: "당신의 모든 노력을 응원합니다",
        bgGradient: "radial-gradient(circle at top left, #ecfdf5, #d1fae5 45%, #a7f3d0 100%)",
        textGradient: "linear-gradient(135deg, #065f46 0%, #059669 60%, #34d399 100%)",
        textShadow: "rgba(5, 150, 105, 0.18)",
        cardBorder: "rgba(167, 243, 208, 0.85)",
        cardShadow: "rgba(6, 95, 70, 0.15)",
        btnBg: "#059669",
        btnHover: "#047857",
        btnGlow: "rgba(5, 150, 105, 0.45)",
        btnRing: "rgba(110, 231, 183, 0.6)"
      },
      {
        text: "충분히 잘하고 있어요",
        bgGradient: "radial-gradient(circle at top left, #fffbeb, #fef3c7 45%, #fde68a 100%)",
        textGradient: "linear-gradient(135deg, #92400e 0%, #d97706 60%, #fbbf24 100%)",
        textShadow: "rgba(217, 119, 6, 0.18)",
        cardBorder: "rgba(253, 230, 138, 0.85)",
        cardShadow: "rgba(146, 64, 14, 0.15)",
        btnBg: "#d97706",
        btnHover: "#b45309",
        btnGlow: "rgba(217, 119, 6, 0.45)",
        btnRing: "rgba(252, 211, 77, 0.6)"
      },
      {
        text: "한 걸음씩 나아가면 결국 도착해요",
        bgGradient: "radial-gradient(circle at top left, #faf5ff, #f3e8ff 45%, #e9d5ff 100%)",
        textGradient: "linear-gradient(135deg, #581c87 0%, #7c3aed 60%, #c084fc 100%)",
        textShadow: "rgba(124, 58, 237, 0.18)",
        cardBorder: "rgba(233, 213, 255, 0.85)",
        cardShadow: "rgba(88, 28, 135, 0.15)",
        btnBg: "#7c3aed",
        btnHover: "#6d28d9",
        btnGlow: "rgba(124, 58, 237, 0.45)",
        btnRing: "rgba(196, 181, 253, 0.6)"
      },
      {
        text: "오늘 하루도 특별하고 소중해요",
        bgGradient: "radial-gradient(circle at top left, #fff1f2, #ffe4e6 45%, #fecdd3 100%)",
        textGradient: "linear-gradient(135deg, #9f1239 0%, #e11d48 60%, #fb7185 100%)",
        textShadow: "rgba(225, 29, 72, 0.18)",
        cardBorder: "rgba(254, 205, 211, 0.85)",
        cardShadow: "rgba(159, 18, 57, 0.15)",
        btnBg: "#e11d48",
        btnHover: "#be123c",
        btnGlow: "rgba(225, 29, 72, 0.45)",
        btnRing: "rgba(253, 164, 175, 0.6)"
      },
      {
        text: "언제나 당신의 빛나는 내일을 믿어요",
        bgGradient: "radial-gradient(circle at top left, #f0fdfa, #ccfbf1 45%, #99f6e4 100%)",
        textGradient: "linear-gradient(135deg, #134e4a 0%, #0d9488 60%, #2dd4bf 100%)",
        textShadow: "rgba(13, 148, 136, 0.18)",
        cardBorder: "rgba(153, 246, 228, 0.85)",
        cardShadow: "rgba(19, 78, 74, 0.15)",
        btnBg: "#0d9488",
        btnHover: "#0f766e",
        btnGlow: "rgba(13, 148, 136, 0.45)",
        btnRing: "rgba(94, 234, 212, 0.6)"
      }
    ];

    let currentIndex = 0;
    const phraseElement = document.getElementById('phrase');
    const nextBtn = document.getElementById('nextBtn');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.style.setProperty('--bg-gradient', theme.bgGradient);
      root.style.setProperty('--text-gradient', theme.textGradient);
      root.style.setProperty('--text-shadow', theme.textShadow);
      root.style.setProperty('--card-border', theme.cardBorder);
      root.style.setProperty('--card-shadow', theme.cardShadow);
      root.style.setProperty('--btn-bg', theme.btnBg);
      root.style.setProperty('--btn-hover', theme.btnHover);
      root.style.setProperty('--btn-glow', theme.btnGlow);
      root.style.setProperty('--btn-ring', theme.btnRing);
    }

    nextBtn.addEventListener('click', () => {
      phraseElement.classList.add('fade');
      currentIndex = (currentIndex + 1) % themes.length;
      const nextTheme = themes[currentIndex];

      applyTheme(nextTheme);

      setTimeout(() => {
        phraseElement.textContent = nextTheme.text;
        phraseElement.classList.remove('fade');
      }, 250);
    });
  </script>
</body>

</html>
